version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: quizforge_db
    restart: always
    environment:
      POSTGRES_USER: quizforge_admin
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: quizforge_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizforge_admin -d quizforge_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
